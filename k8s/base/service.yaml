apiVersion: v1
kind: Service
metadata:
  name: pterodactyl-monitor
spec:
  # ClusterIP by default. The overlay decides how (and to whom) the dashboard
  # is exposed - see ../example/kustomization.yaml for a LAN-only LoadBalancer.
  type: ClusterIP
  selector:
    app: pterodactyl-monitor
  ports:
    - name: http
      port: 80
      targetPort: http
