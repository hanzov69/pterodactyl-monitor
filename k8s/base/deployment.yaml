apiVersion: apps/v1
kind: Deployment
metadata:
  name: pterodactyl-monitor
  labels:
    app: pterodactyl-monitor
spec:
  replicas: 1 # single writer to the state file; do not scale up
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pterodactyl-monitor
  template:
    metadata:
      labels:
        app: pterodactyl-monitor
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: monitor
          image: ghcr.io/hanzov69/pterodactyl-monitor:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: pterodactyl-monitor
            - secretRef:
                name: pterodactyl-monitor
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pterodactyl-monitor-data
